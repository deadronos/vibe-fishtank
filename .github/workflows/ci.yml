name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Typecheck, lint, formatting, then the tests with coverage thresholds.
      - run: pnpm check
      - run: pnpm build

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
